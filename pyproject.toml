[project]
name = "sebastian"
version = "1.0.0"
description = "基于 LLM 的多 Agent 协作终端助手"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "lem0ntr1" },
]
keywords = ["llm", "multi-agent", "agent", "cli", "sandbox", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Natural Language :: Chinese (Simplified)",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.9",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "ddgs>=9.0",
    "baidusearch>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastmcp>=4.0.5",
]

[project.scripts]
sebastian = "cli:app"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# 运行时资源：缺少这些文件时，安装后的沙箱默认配置与子 Agent 提示词会失效
[tool.setuptools.package-data]
src = ["settings.json"]
# subagents 目录没有 __init__.py，不是独立包，因此挂在父包 src.agents 下声明
"src.agents" = ["subagents/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F"]

[build-system]
requires = ["setuptools>=59.6.0"]
build-backend = "setuptools.build_meta"
